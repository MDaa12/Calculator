<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="calculator" aria-label="Calculator">
      <header class="calculator-header">
        <div>
              <p class="eyebrow">Everyday arithmetic + science</p>
          <h1>Calculator</h1>
        </div>
        <span class="status-dot" aria-label="Ready"></span>
      </header>

      <div class="display" aria-live="polite">
        <div class="expression" id="expression">0</div>
        <div class="result" id="result">0</div>
      </div>

      <div class="keypad" id="keypad">
        <button class="key key-science" data-function="sin">sin</button>
        <button class="key key-science" data-function="cos">cos</button>
        <button class="key key-science" data-function="tan">tan</button>
        <button class="key key-science" data-function="sqrt">√</button>

        <button class="key key-science" data-function="log">log</button>
        <button class="key key-science" data-function="ln">ln</button>
        <button class="key key-science" data-function="square">x²</button>
        <button class="key key-science" data-function="factorial">n!</button>

        <button class="key key-muted" data-action="clear">AC</button>
        <button class="key key-muted" data-action="delete" aria-label="Delete last character">DEL</button>
        <button class="key key-muted" data-function="percent">%</button>
        <button class="key key-muted" data-function="sign">±</button>

        <button class="key key-muted" data-function="constant-pi">π</button>
        <button class="key key-muted" data-function="constant-e">e</button>
        <button class="key key-muted" data-function="reciprocal">1/x</button>
        <button class="key key-muted" data-value="(">(</button>
        <button class="key key-muted" data-value=")">)</button>

        <button class="key key-operator" data-value="/">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key key-operator" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key key-operator" data-value="%">mod</button>

        <button class="key key-operator" data-value="-">−</button>
        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key key-operator" data-value="^">xʸ</button>

        <button class="key key-wide" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key key-operator" data-value="+">+</button>
        <button class="key key-equals" data-action="equals">=</button>
      </div>
    </section>

    <aside class="history-panel">
      <div class="history-heading">
        <div>
          <p class="eyebrow">Your workspace</p>
          <h2>History</h2>
        </div>
        <button class="clear-history" id="clear-history" type="button">Clear</button>
      </div>
      <div class="history-list" id="history-list">
        <p class="empty-history">Your calculations will appear here.</p>
      </div>
      <p class="keyboard-hint"><kbd>Enter</kbd> to calculate <span>·</span> <kbd>Esc</kbd> to clear</p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
